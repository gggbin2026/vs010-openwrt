#
# 联通 VS010 (CUCC AX3000) —— 极简 WDS 网桥固件
# 底座: kkstone/immortalwrt-ipq50xx @ openwrt-21.02 (5.4-QSDK + swconfig + NSS)
#
# 相对上一版（VS010_QSDK_修复包）的变化：
#   * .config 330 包 / IPv6 编译期关 -> 137 包 / IPv6 从内核到配置面全关
#   * 新增 defconfig -> slim -> defconfig 三段收敛 + 硬校验
#   * 新增 nss-dp ethtool 补丁注入 + 编译后确认（修网口速率显示）
#   * 新增 files/ 网桥就绪脚本（STP / 防火墙全放行 / DHCP 开关）
#   * 产物固件文件名统一以 Nwrt-QSDK12.2- 开头，自动发布到 Releases
#   * 每次编译把构建记录追加回仓库 BUILD_HISTORY.md
#   * 删掉 Generate release tag / Upload firmware to release 两步
#   * 加 permissions / pipefail / 产物强校验 / 失败也传日志
#
# ⚠️ 仓库里旧的 .github/workflows/build.yml（OpenWrt main 6.12 + DSA）必须删掉，
#    两个 workflow 同时 push 触发会互相污染。本包只提供这一个。
#

name: Build VS010 slim WDS (QSDK 5.4)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (tmate)'
        required: false
        default: 'false'
        type: boolean
      use_nwrt_dump_dts:
        description: '实验性：NWRT 反编译硬件真值 DTS（默认关＝模板 DTS；实测稳定，勾 true 曾触发 30s kernel panic）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/kkstone/immortalwrt-ipq50xx
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  SLIM_SH: slim.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  # 0 = 所有 Release 永久保留（≥5 次）；填 N 则只留最新 N 个，强制保底 5
  KEEP_RELEASES: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        df -h
        sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' \
          azure-cli google-cloud-sdk google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android \
          /usr/local/lib/node_modules || true
        sudo -E apt-get -qq update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar \
          flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
          intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build \
          p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir && sudo chown $USER:$GROUPS /workdir

    - name: Clone QSDK source code
      working-directory: /workdir
      run: |
        set -e
        git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "=== 底座关键路径自检 ==="
        test -f openwrt/target/linux/ipq50xx/image/Makefile || { echo "::error::底座结构不对"; exit 1; }
        test -f openwrt/target/linux/ipq50xx/dts/ipq5000-rax3000q.dts || { echo "::error::缺 rax3000q DTS 模板"; exit 1; }
        grep -q 'qcom,ess-switch-qca83xx' openwrt/target/linux/ipq50xx/dts/ipq5000-rax3000q.dts \
          || { echo "::error::这不是 QSDK 树（别把 DSA DTS 塞进来）"; exit 1; }
        test -f openwrt/package/kernel/qca/qca-nss-dp/Makefile \
          || { echo "::error::缺 qca-nss-dp（ethtool 补丁无处可打）"; exit 1; }

    - name: Enable build ccache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'vs010-ipq50xx-qsdk-5.4-slim-wds'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        set -e
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt && $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update and install feeds
      run: |
        set -e
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration + inject VS010
      run: |
        set -euo pipefail
        # files/ 里的网桥就绪脚本会被搬进 openwrt/files/，随镜像打包
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH $SLIM_SH
        cd openwrt
        USE_NWRT_DTS="${{ inputs.use_nwrt_dump_dts }}" $GITHUB_WORKSPACE/$DIY_P2_SH

        # ── 构建时间 = 本次编译真实时刻（上海）─────────────────
        # SOURCE_DATE_EPOCH 让内核 / 文件 mtime / 版本时间戳都用本次编译时间，
        # 不再沿用底座固定的旧日期；同时写进固件 /etc/compile_time 供 banner 显示。
        BUILD_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
        echo "SOURCE_DATE_EPOCH=$(date +%s)" >> $GITHUB_ENV
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
        mkdir -p files/etc
        printf '%s\n' "$BUILD_TIME" > files/etc/compile_time
        echo "  ✓ 构建时间: $BUILD_TIME"

    - name: Inject nss-dp ethtool fix
      run: |
        set -euo pipefail
        chmod +x $GITHUB_WORKSPACE/inject-ethtool-patch.sh
        cd openwrt
        $GITHUB_WORKSPACE/inject-ethtool-patch.sh
        test -s package/kernel/qca/qca-nss-dp/patches/999-nss-dp-ethtool-fixed-link.patch \
          || { echo "::error::ethtool 补丁未落位"; exit 1; }

    - name: SSH connection to Actions
      uses: owenthereal/action-upterm@v1
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

    - name: Extend 421 NAND patch with GD5Fx IDs
      run: |
        set -euo pipefail
        chmod +x $GITHUB_WORKSPACE/extend-421-nand.sh
        cd openwrt
        $GITHUB_WORKSPACE/extend-421-nand.sh
        grep -qE '0xc8, 0x(41|77|81)' \
          target/linux/ipq50xx/patches/421-mtd-rawnand-winbond-add-support-for-W25N01GW.patch \
          || { echo "::error::GD5Fx ID 未写入 421 补丁"; exit 1; }

    - name: QSDK kernel tarballs fallback
      run: |
        cd openwrt
        mkdir -p dl
        curl -sSL --max-time 120 -o dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz \
          "https://www.dropbox.com/scl/fi/9ts30p2csnlb9imaf8k68/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz?rlkey=sntbyfjgg86gu2uoocgb9ggp1&st=7w81hl56&dl=1" || rm -f dl/backports-20210222-5.4-qsdk-11.5.0.5.tar.xz
        curl -sSL --max-time 120 -o dl/linux-5.4-qsdk-11.5.0.5.tar.xz \
          "https://www.dropbox.com/scl/fi/gu7ge6jmefn72ttuop1zs/linux-5.4-qsdk-11.5.0.5.tar.xz?rlkey=tdpq0ye35x290frbh7i8uqrm8&st=jjvegqrr&dl=1" || rm -f dl/linux-5.4-qsdk-11.5.0.5.tar.xz
        find dl -maxdepth 1 -size -1024c -type f -delete || true

    - name: defconfig -> slim -> defconfig (防 IPv6 / 插件被拉回)
      run: |
        set -euo pipefail
        cd openwrt
        make defconfig
        $GITHUB_WORKSPACE/$SLIM_SH
        make defconfig
        echo "=== 最终配置硬校验 ==="
        Y=$(grep -c '^CONFIG_PACKAGE_.*=y$' .config || true)
        echo "  启用包数: $Y（原仓库 330）"
        grep -E '^CONFIG_TARGET_ipq50xx_arm_DEVICE_cucc_vs010=y' .config \
          || { echo "::error::cucc_vs010 设备符号丢失"; exit 1; }
        grep -E '^CONFIG_ATH11K_MEM_PROFILE_256M=y' .config \
          || { echo "::error::256M 内存优化丢失（WiFi 会 OOM）"; exit 1; }
        grep -E '^CONFIG_ATH11K_NSS_SUPPORT=y' .config \
          || echo "::warning::NSS WiFi 未启用"
        # 2026-11-21：IPv6 编译期开启会触发 QSDK 5.4 ECM 的 BUG_ON panic，
        # 本版必须关闭；被 defconfig 拉回就立即停，不白跑一小时编译。
        if grep -q '^CONFIG_IPV6=y' .config || grep -q '^CONFIG_KERNEL_IPV6=y' .config; then
          echo "::error::IPv6 被拉回（本版编译期必须关闭，否则开机 30s kernel panic）"; grep -E '^CONFIG_(IPV6|KERNEL_IPV6)' .config; exit 1
        fi
        if ! grep -q '^CONFIG_PACKAGE_MAC80211_DEBUGFS=y' .config; then
          echo "::error::MAC80211_DEBUGFS 被关掉 —— QSDK 11.5 ath11k 会报 'struct ath11k has no member named debug'"; exit 1
        fi
        if grep -q '^CONFIG_PACKAGE_ipq-wifi-cmcc_rax3000q=y' .config; then
          echo "::error::误打包了 RAX3000Q 的 BDF（VS010 走 0:ART caldata）"; exit 1
        fi
        if ! grep -q '^CONFIG_PACKAGE_MAC80211_MESH=y' .config; then
          echo "::error::MAC80211_MESH 被关掉 —— QSDK 11.5 的 debug_nss.c / debugfs_sta.c 会引用 mesh 成员与函数而编译失败"; exit 1
        fi

        if ! grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config; then
          echo "::error::ARGON 主题未启用"; exit 1
        fi
        test -s files/etc/sysctl.d/99-no-icmp-redirect.conf \
          || { echo "::error::ICMP 重定向关闭配置未打包"; exit 1; }
        test -s files/etc/compile_time \
          || { echo "::error::构建时间文件缺失"; exit 1; }
        echo "  ✓ ARGON / ICMP 重定向 / 编译时间文件就位"

        echo "  ✓ 设备 / 256M / NSS / IPv6(关) / BDF 全部符合预期"

    - name: Verify NIC drivers & switch DTS
      run: |
        set -euo pipefail
        cd openwrt
        echo "=== 网卡 / QCA8337 交换驱动硬校验 ==="
        for k in kmod-qca-ssdk-nohnat kmod-qca-nss-dp kmod-qca-nss-drv \
                 qca-nss-fw-ipq50xx-retail swconfig ; do
          grep -q "^CONFIG_PACKAGE_${k}=y" .config \
            || { echo "::error::驱动 $k 丢失 —— ess-switch 不 probe，四个网口全不通"; exit 1; }
        done
        echo "  ✓ 5 个驱动均 =y（内建，非 insmod）"
        D=target/linux/ipq50xx/dts
        grep -rl 'ess-switch' "$D" >/dev/null \
          || { echo "::error::DTS 里没有 ess-switch 节点"; exit 1; }
        grep -rl 'qcom,nss-dp' "$D" >/dev/null \
          || { echo "::error::DTS 里没有 nss-dp 节点"; exit 1; }
        echo "  ✓ ess-switch / nss-dp 节点存在"
        VS="$D/ipq5018-vs010.dts"
        if [ "${{ inputs.use_nwrt_dump_dts }}" = "true" ]; then
          grep -q 'clock-names' "$VS" && grep -q 'reset-names' "$VS" \
            || { echo "::error::硬件真值 DTS 缺 clock-names / reset-names，ess-switch 仍会 probe 失败"; exit 1; }
          echo "  ✓ VS010 真值 DTS 含 22 时钟 / 6 复位"
        else
          grep -q 'qcom,ess-switch-qca83xx' "$VS" \
            || { echo "::error::VS010 DTS 缺 qca83xx 交换节点"; exit 1; }
          echo "  ✓ VS010 模板 DTS 含 qca83xx 节点（有线口已由「关 VLAN + 双 CPU 口进桥」修复）"
        fi

    - name: Prefetch ath-kernel tarball (avoid flaky git clone)
      run: |
        set -euo pipefail
        chmod +x "$GITHUB_WORKSPACE/prefetch-ath-kernel.sh"
        "$GITHUB_WORKSPACE/prefetch-ath-kernel.sh" openwrt/dl

    - name: Download package
      run: |
        set -euo pipefail
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        set -euo pipefail
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) V=s 2>&1 | tee build.log || {
          echo "::error::编译失败，build.log 已上传"; exit 1;
        }
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "=== 产物 ==="
        ls -lh bin/targets/ipq50xx/arm/*vs010* || true

    - name: Verify ethtool patch applied
      if: steps.compile.outputs.status == 'success'
      run: |
        set -euo pipefail
        cd openwrt
        SRC=$(find build_dir -name nss_dp_ethtools.c -path '*qca-nss-dp*' 2>/dev/null | head -1)
        test -n "$SRC" || { echo "::error::找不到 nss_dp_ethtools.c"; exit 1; }
        grep -q 'nss_dp_get_link_ksettings' "$SRC" \
          || { echo "::error::补丁未被 Build/Prepare 应用，网口速率修复不会生效"; exit 1; }
        echo "  ✓ nss_dp_get_link_ksettings 已编入: $SRC"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        cd openwrt/bin/targets/ipq50xx/arm
        rm -rf packages
        mkdir -p $GITHUB_WORKSPACE/firmware_out
        cp -a *vs010* $GITHUB_WORKSPACE/firmware_out/ 2>/dev/null || true

        # ── 固件文件名：只把发行前缀换成 Nwrt-QSDK12.2-，其余部分一字不改 ──
        #   immortalwrt-ipq50xx-arm-cucc_vs010-...-factory.ubi
        #   注：前缀只是命名，不代表真的 QSDK 12.2 基线（实际 5.4 / NHSS.11.5.0.5）
        #   → Nwrt-QSDK12.2-ipq50xx-arm-cucc_vs010-...-factory.ubi
        cd $GITHUB_WORKSPACE/firmware_out
        for f in *; do
          [ -f "$f" ] || continue
          case "$f" in
            Nwrt-QSDK12.2-*) continue ;;
            [Qq][Ss][Dd][Kk]-*) new="Nwrt-QSDK12.2-${f#*-}" ;;
            [Ii][Mm][Mm][Oo][Rr][Tt][Aa][Ll][Ww][Rr][Tt]-*|[Oo][Pp][Ee][Nn][Ww][Rr][Tt]-*|[Ll][Ee][Dd][Ee]-*) new="Nwrt-QSDK12.2-${f#*-}" ;;
            *) continue ;;
          esac
          [ "$new" = "$f" ] && continue
          mv -f -- "$f" "$new"
          echo "  重命名: $f → $new"
        done
        # 兜底：万一底座换了别的前缀，factory.ubi 也保证以 Nwrt-QSDK12.2- 开头
        for f in *factory.ubi; do
          [ -f "$f" ] || continue
          case "$f" in Nwrt-QSDK12.2-*) ;; *) mv -f -- "$f" "Nwrt-QSDK12.2-$f"; echo "  重命名(兜底): $f → Nwrt-QSDK12.2-$f" ;; esac
        done
        # 校验：绝不放行任何旧前缀；必须有 Nwrt-QSDK12.2-*factory.ubi
        if ls -1 | grep -qiE '^(immortalwrt|openwrt|lede|qsdk)-'; then
          echo "::error::仍有旧前缀固件文件"; ls -lh; exit 1
        fi
        test -n "$(ls -1 Nwrt-QSDK12.2-*factory.ubi 2>/dev/null)" \
          || { echo "::error::重命名后缺 Nwrt-QSDK12.2-*factory.ubi"; ls -lh; exit 1; }
        # 若顺带复制了校验文件，按新名字重算，避免名字对不上
        if [ -f sha256sums ]; then
          rm -f sha256sums
          for x in *; do [ -f "$x" ] && sha256sum "$x"; done > sha256sums
        fi

        echo "=== 交付产物 ==="
        ls -lh $GITHUB_WORKSPACE/firmware_out/
        echo "FIRMWARE=$GITHUB_WORKSPACE/firmware_out" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: VS010_slim_WDS${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error
        retention-days: 90

    - name: Publish firmware to Releases (permanent, timestamped)
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
        # KEEP_RELEASES 来自顶层 env，runner 会自动注入所有 step
      run: |
        set -euo pipefail
        command -v gh >/dev/null 2>&1 || { echo "::error::runner 缺少 gh CLI"; exit 1; }
        test -n "${FIRMWARE:-}" && test -n "$(ls -A "$FIRMWARE" 2>/dev/null)" \
          || { echo "::error::没有待发布固件目录"; exit 1; }

        # 按上海时间 + run_number 生成唯一 tag：每次重编都单独存档，互不覆盖
        TAG="fw-$(date +'%Y%m%d-%H%M%S')-r${{ github.run_number }}"
        {
          echo "极简 WDS 网桥固件（5.4-QSDK / IPQ50xx）"
          echo ""
          echo "- 构建时间（上海）：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "- Commit：${{ github.sha }}"
          echo "- Run：#${{ github.run_number }} / attempt ${{ github.run_attempt }}"
          echo "- 命名说明：前缀仅为文件名标识，实际基线 Linux 5.4 / NHSS.11.5.0.5，非 QSDK 12.2"
          echo "- 日志：CHANGELOG.md（修复时间线）/ BUILD_HISTORY.md（每次编译自动追加）"
          echo "- 内容：上海时区+编译时刻 / 全射频 CN / ARGON 主题 / ethtool 1000M-Full / NAND 421 / MESH+DEBUGFS / 有线口修复 / 关 ICMP 重定向"
          echo "- IPv6 编译期关闭，WAN6 已删除；DHCP 默认开，bridge-dhcp off 可关回纯透传"
          echo "- 管理 IP：192.168.1.241；账号 root / 密码 admin；WDS SSID WDS_AP / 密钥 WDS123456；STP 开；固件前缀 Nwrt-QSDK12.2-"
          echo "- 有线修复：关 VLAN + eth0/eth1 都进 br-lan；构建时刻写入 /etc/compile_time"
          echo "- VS010 使用 NWRT 硬件真值 DTS（22 时钟 / 6 复位）修交换芯片 probe"
          echo "- 刷机：Nwrt-QSDK12.2-*-nand-factory.ubi；TTL 只接 TX/RX/GND，先备份 0:ART"
        } > /tmp/relnotes.md

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "  tag 已存在（同秒重跑），改用 --clobber 覆盖附件"
          gh release upload "$TAG" "$FIRMWARE"/* --clobber
        else
          gh release create "$TAG" "$FIRMWARE"/* \
            --title "固件 $TAG" --notes-file /tmp/relnotes.md
        fi
        echo "  ✓ 已发布：https://github.com/${{ github.repository }}/releases/tag/$TAG"

        # ── 可选清理：KEEP_RELEASES=0 → 全部永久保留（天然满足「最低 5 次」）
        #    填 N>0 时只清理本 workflow 建的 fw-* 旧版，且强制保底 5 个 ──
        KEEP="${KEEP_RELEASES:-0}"
        case "$KEEP" in ''|*[!0-9]*) KEEP=0 ;; esac
        if [ "$KEEP" -gt 0 ]; then
          [ "$KEEP" -lt 5 ] && KEEP=5          # 硬保底：任何情况下至少留 5 次
          TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                 | grep '^fw-' | sort -r || true)
          i=0
          for t in $TAGS; do
            i=$((i+1))
            [ "$i" -le "$KEEP" ] && continue
            echo "  清理第 $i 个旧版：$t（保留最新 $KEEP 个）"
            gh release delete "$t" --yes --cleanup-tag || true
          done
        fi
    - name: Append build history to repository
      if: steps.compile.outputs.status == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # 每次编译把「构建时间 / run / commit / 产物 / 本版配置」追加回仓库，
        # 出问题能按时间倒查是哪一轮改了什么。push 失败只告警，不影响固件与 Release。
        STAMP="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
        RUN_NO='${{ github.run_number }}'
        RUN_ATTEMPT='${{ github.run_attempt }}'
        SHA='${{ github.sha }}'
        BRANCH='${{ github.ref_name }}'
        FILES="$(cd "$FIRMWARE" && ls -1 | tr '\n' ' ')"
        HDR='| 构建时间(上海) | Run | Commit | 产物 | 本版关键配置 |'
        SEP='|---|---|---|---|---|'
        grep -qF "$HDR" BUILD_HISTORY.md 2>/dev/null || printf '%s\n%s\n' "$HDR" "$SEP" >> BUILD_HISTORY.md
        printf '| %s | #%s / attempt %s | `%s` | %s | 前缀 `Nwrt-QSDK12.2-` · ARGON · IP 192.168.1.241 · root/admin · WDS_AP/WDS123456 · STP 开 · IPv6 编译期关 · WAN6 删 · ICMP 重定向关 · 有线口修复(关 VLAN + eth0/eth1 进桥) |\n' \
          "$STAMP" "$RUN_NO" "$RUN_ATTEMPT" "$SHA" "$FILES" \
          >> BUILD_HISTORY.md
        echo "  ✓ 已追加构建记录到 BUILD_HISTORY.md"
        git config user.name  'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add BUILD_HISTORY.md
        if git diff --cached --quiet; then
          echo "  BUILD_HISTORY.md 无新增内容，跳过提交"
        else
          git commit -m "chore: 记录构建 #${RUN_NO}（${STAMP}）[skip ci]"
          git pull --rebase --autostash origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH" \
            || echo "::warning::BUILD_HISTORY.md 推送失败（权限/并发），固件与 Release 不受影响"
        fi
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VS010_build_log${{ env.FILE_DATE }}
        path: openwrt/build.log
        if-no-files-found: ignore
        retention-days: 14
